<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>iOS 26 Liquid Glass Toggle</title>
  <style>
    /* ─── Design tokens ─── */
    :root {
      --accent: #6e4bff;
      --accent-glow: rgba(110, 75, 255, 0.55);
      --accent-soft: rgba(110, 75, 255, 0.22);
      --glass-fill-off: rgba(255, 255, 255, 0.08);
      --glass-fill-on: rgba(255, 255, 255, 0.14);
      --glass-stroke: rgba(255, 255, 255, 0.28);
      --glass-stroke-strong: rgba(255, 255, 255, 0.45);
      --thumb-size: 28px;
      --track-w: 52px;
      --track-h: 32px;
      --track-pad: 2px;
      --spring-stiffness: 280;
      --spring-damping: 22;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      background:
        radial-gradient(ellipse 120% 80% at 20% 10%, rgba(110, 75, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 90% 70% at 85% 75%, rgba(64, 156, 255, 0.12), transparent 45%),
        linear-gradient(165deg, #0a0a12 0%, #12121f 40%, #0d0d16 100%);
      color: rgba(255, 255, 255, 0.92);
    }

    .demo-label {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .demo-hint {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      max-width: 20rem;
      line-height: 1.5;
    }

    /* ─── Toggle root ─── */
    .liquid-toggle {
      --pointer-x: 0.5;
      --pointer-y: 0.5;
      --thumb-x: 0;
      --thumb-scale-x: 1;
      --thumb-scale-y: 1;
      --track-scale: 1;
      --track-bend: 0;
      --highlight-intensity: 0.65;
      --reflection-shift: 0px;
      --parallax-x: 0px;
      --parallax-y: 0px;
      --liquid-phase: 0;
      --ripple: 0;
      --glow: 0;
      --accent-fill: 0;

      position: relative;
      width: var(--track-w);
      height: var(--track-h);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transform: scale(var(--track-scale)) translateZ(0);
      will-change: transform;
      contain: layout style;
    }

    .liquid-toggle:focus-visible .liquid-toggle__track {
      box-shadow:
        0 0 0 3px rgba(110, 75, 255, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-toggle,
      .liquid-toggle * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* ─── Track shell (multi-layer glass) ─── */
    .liquid-toggle__track {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0);
      will-change: transform, filter;
      transition: box-shadow 0.45s var(--ease-out-expo);
      box-shadow:
        0 calc(4px + var(--track-bend) * 2px) calc(16px + var(--track-bend) * 4px) rgba(0, 0, 0, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.12) inset,
        0 -1px 0 rgba(0, 0, 0, 0.2) inset;
    }

    /* Layer 1: frosted base */
    .liquid-toggle__glass-base {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, calc(0.14 + var(--accent-fill) * 0.06)) 0%,
          rgba(255, 255, 255, calc(0.04 + var(--accent-fill) * 0.04)) 45%,
          rgba(0, 0, 0, calc(0.06 - var(--accent-fill) * 0.02)) 100%
        );
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      transform: translateZ(0);
    }

    /* Layer 2: accent fill (ON) */
    .liquid-toggle__accent {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: var(--accent-fill);
      background: linear-gradient(
        105deg,
        var(--accent) 0%,
        #8b6dff 38%,
        #5a3de8 100%
      );
      transform: translateZ(0);
      transition: opacity 0.5s var(--ease-out-expo);
    }

    /* Layer 3: liquid light sweep */
    .liquid-toggle__liquid {
      position: absolute;
      inset: -20%;
      border-radius: inherit;
      opacity: calc(var(--accent-fill) * 0.85);
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 25%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0.12) 75%,
        transparent 100%
      );
      background-size: 200% 100%;
      background-position: calc(var(--liquid-phase) * 100%) 0;
      mix-blend-mode: overlay;
      pointer-events: none;
      transform: translateZ(0);
    }

    /* Layer 4: refraction / chromatic fringe */
    .liquid-toggle__refract {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          calc(120deg + var(--pointer-x) * 40deg),
          rgba(255, 120, 200, 0.06) 0%,
          transparent 35%,
          rgba(120, 200, 255, 0.07) 70%,
          transparent 100%
        );
      opacity: calc(0.5 + var(--highlight-intensity) * 0.35);
      transform: translate(var(--parallax-x), var(--parallax-y)) translateZ(0);
      pointer-events: none;
    }

    /* Layer 5: moving reflection */
    .liquid-toggle__reflection {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        calc(168deg + (var(--pointer-x) - 0.5) * 24deg),
        transparent 0%,
        rgba(255, 255, 255, 0.22) 42%,
        rgba(255, 255, 255, 0.08) 52%,
        transparent 62%
      );
      transform: translateX(var(--reflection-shift)) translateZ(0);
      opacity: calc(0.35 + var(--highlight-intensity) * 0.4);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    /* Layer 6: edge highlights */
    .liquid-toggle__edge {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid var(--glass-stroke);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, calc(0.35 + var(--highlight-intensity) * 0.25)),
        inset 0 -0.5px 0 rgba(0, 0, 0, 0.15);
      pointer-events: none;
      transition: border-color 0.35s var(--ease-out-expo);
    }

    .liquid-toggle[aria-checked="true"] .liquid-toggle__edge {
      border-color: rgba(255, 255, 255, 0.38);
    }

    /* Layer 7: ambient glow */
    .liquid-toggle__glow {
      position: absolute;
      inset: -40%;
      border-radius: inherit;
      background: radial-gradient(
        ellipse 80% 120% at calc(20% + var(--thumb-x) * 0.6) 50%,
        var(--accent-glow),
        transparent 65%
      );
      opacity: calc(var(--glow) * var(--accent-fill));
      filter: blur(12px);
      pointer-events: none;
      transform: translateZ(0);
    }

    /* Layer 8: release ripple */
    .liquid-toggle__ripple {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at calc(15% + var(--thumb-x) * 70%) 50%,
        rgba(255, 255, 255, calc(0.35 * var(--ripple))) 0%,
        transparent calc(28% + var(--ripple) * 42%)
      );
      opacity: var(--ripple);
      pointer-events: none;
      transform: translateZ(0);
    }

    /* ─── Thumb ─── */
    .liquid-toggle__thumb-wrap {
      position: absolute;
      top: var(--track-pad);
      left: var(--track-pad);
      width: var(--thumb-size);
      height: var(--thumb-size);
      transform:
        translateX(calc(var(--thumb-x) * (var(--track-w) - var(--thumb-size) - var(--track-pad) * 2)))
        translateZ(0);
      will-change: transform;
      pointer-events: none;
    }

    .liquid-toggle__thumb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transform:
        scaleX(var(--thumb-scale-x))
        scaleY(var(--thumb-scale-y))
        translateZ(0);
      will-change: transform;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.28),
        0 0 calc(12px * var(--accent-fill)) var(--accent-soft),
        0 1px 0 rgba(255, 255, 255, 0.55) inset;
    }

    .liquid-toggle__thumb-glass {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(240, 240, 248, 0.88) 40%,
        rgba(220, 220, 235, 0.82) 100%
      );
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .liquid-toggle__thumb-shine {
      position: absolute;
      inset: 2px 3px auto 3px;
      height: 42%;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      opacity: 0.85;
    }

    .liquid-toggle__thumb-specular {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at calc(35% + (var(--pointer-x) - 0.5) * 20%) calc(30% + (var(--pointer-y) - 0.5) * 15%),
        rgba(255, 255, 255, 0.55) 0%,
        transparent 55%
      );
      mix-blend-mode: overlay;
    }

    /* Hover / pressed via data attributes (JS-driven for precision) */
    .liquid-toggle[data-hover="true"] {
      --highlight-intensity: 1;
    }

    .liquid-toggle[data-pressed="true"] {
      --track-bend: 1;
      --highlight-intensity: 1.15;
    }

    .liquid-toggle[aria-checked="true"] {
      --glow: 1;
    }

    /* Status text for screen readers + visual */
    .liquid-toggle__state {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-pill__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transition: background 0.4s var(--ease-out-expo), box-shadow 0.4s var(--ease-out-expo);
    }

    .status-pill[data-on="true"] .status-pill__dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>
  <p class="demo-label">iOS 26 · Liquid Glass</p>

  <button
    type="button"
    class="liquid-toggle"
    role="switch"
    aria-checked="false"
    aria-label="Liquid Glass toggle"
    id="liquidToggle"
  >
    <span class="liquid-toggle__track">
      <span class="liquid-toggle__glass-base" aria-hidden="true"></span>
      <span class="liquid-toggle__accent" aria-hidden="true"></span>
      <span class="liquid-toggle__liquid" aria-hidden="true"></span>
      <span class="liquid-toggle__refract" aria-hidden="true"></span>
      <span class="liquid-toggle__reflection" aria-hidden="true"></span>
      <span class="liquid-toggle__glow" aria-hidden="true"></span>
      <span class="liquid-toggle__ripple" aria-hidden="true"></span>
      <span class="liquid-toggle__edge" aria-hidden="true"></span>
      <span class="liquid-toggle__thumb-wrap" aria-hidden="true">
        <span class="liquid-toggle__thumb">
          <span class="liquid-toggle__thumb-glass"></span>
          <span class="liquid-toggle__thumb-shine"></span>
          <span class="liquid-toggle__thumb-specular"></span>
        </span>
      </span>
    </span>
    <span class="liquid-toggle__state" id="toggleState" aria-live="polite">Off</span>
  </button>

  <div class="status-pill" id="statusPill" data-on="false">
    <span class="status-pill__dot" aria-hidden="true"></span>
    <span id="statusLabel">Off</span>
  </div>

  <p class="demo-hint">Hover for parallax reflections · Press for liquid compression · Toggle for spring motion</p>

  <script>
    (function () {
      "use strict";

      const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const toggle = document.getElementById("liquidToggle");
      const stateEl = document.getElementById("toggleState");
      const statusPill = document.getElementById("statusPill");
      const statusLabel = document.getElementById("statusLabel");

      const STIFFNESS = 280;
      const DAMPING = 22;
      const SCALE_STIFFNESS = 320;
      const SCALE_DAMPING = 26;

      let checked = false;
      let targetThumb = 0;
      let thumbPos = 0;
      let thumbVel = 0;
      let targetAccent = 0;
      let accentPos = 0;
      let accentVel = 0;

      let targetTrackScale = 1;
      let trackScale = 1;
      let trackScaleVel = 0;

      let thumbScaleX = 1;
      let thumbScaleY = 1;
      let thumbScaleXVel = 0;
      let thumbScaleYVel = 0;
      let targetThumbScaleX = 1;
      let targetThumbScaleY = 1;

      let pointerX = 0.5;
      let pointerY = 0.5;
      let targetPointerX = 0.5;
      let targetPointerY = 0.5;

      let reflectionShift = 0;
      let targetReflectionShift = 0;
      let reflectionVel = 0;

      let liquidPhase = 0;
      let liquidVel = 0;
      let targetLiquidPhase = 0;
      let ambientLiquid = 0;

      let ripple = 0;
      let rippleVel = 0;

      let highlightIntensity = 0.65;
      let targetHighlight = 0.65;

      let trackBend = 0;
      let targetBend = 0;

      let parallaxX = 0;
      let parallaxY = 0;

      let isHover = false;
      let isPressed = false;
      let rafId = null;

      function springStep(current, velocity, target, stiffness, damping, dt) {
        const force = (target - current) * stiffness;
        const damp = velocity * damping;
        const accel = force - damp;
        const v = velocity + accel * dt;
        const x = current + v * dt;
        return { x, v };
      }

      function setChecked(next) {
        checked = next;
        targetThumb = checked ? 1 : 0;
        targetAccent = checked ? 1 : 0;
        targetLiquidPhase = checked ? 1 : 0.15;
        toggle.setAttribute("aria-checked", String(checked));
        const label = checked ? "On" : "Off";
        stateEl.textContent = label;
        statusLabel.textContent = label;
        statusPill.dataset.on = String(checked);
        if (!REDUCED_MOTION) {
          triggerRipple();
        }
      }

      function triggerRipple() {
        ripple = 1;
        rippleVel = -3.2;
      }

      function updatePointerFromEvent(e) {
        const rect = toggle.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        targetPointerX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        targetPointerY = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
        targetReflectionShift = (targetPointerX - 0.5) * 14;
        parallaxX = (targetPointerX - 0.5) * 3;
        parallaxY = (targetPointerY - 0.5) * 2;
      }

      function applyInteractionTargets() {
        if (isPressed) {
          targetTrackScale = 0.96;
          targetThumbScaleX = 1.08;
          targetThumbScaleY = 0.92;
          targetBend = 1;
          targetHighlight = 1.15;
        } else if (isHover) {
          targetTrackScale = 1.04;
          targetThumbScaleX = 1;
          targetThumbScaleY = 1;
          targetBend = 0;
          targetHighlight = 1;
        } else {
          targetTrackScale = 1;
          targetThumbScaleX = 1;
          targetThumbScaleY = 1;
          targetBend = 0;
          targetHighlight = checked ? 0.85 : 0.65;
        }
      }

      function tick(now) {
        const dt = Math.min(0.032, (tick.last ? (now - tick.last) : 16) / 1000);
        tick.last = now;

        if (REDUCED_MOTION) {
          thumbPos = targetThumb;
          accentPos = targetAccent;
          trackScale = targetTrackScale;
          thumbScaleX = targetThumbScaleX;
          thumbScaleY = targetThumbScaleY;
          pointerX = targetPointerX;
          pointerY = targetPointerY;
          reflectionShift = targetReflectionShift;
          liquidPhase = targetLiquidPhase;
          ripple = 0;
          highlightIntensity = targetHighlight;
          trackBend = targetBend;
        } else {
          let s = springStep(thumbPos, thumbVel, targetThumb, STIFFNESS, DAMPING, dt);
          thumbPos = s.x;
          thumbVel = s.v;

          const stretch = Math.abs(thumbVel) * 0.018;
          const stretchTargetX = targetThumbScaleX + stretch;
          const stretchTargetY = targetThumbScaleY - stretch * 0.6;

          s = springStep(thumbScaleX, thumbScaleXVel, stretchTargetX, SCALE_STIFFNESS, SCALE_DAMPING, dt);
          thumbScaleX = s.x;
          thumbScaleXVel = s.v;
          s = springStep(thumbScaleY, thumbScaleYVel, stretchTargetY, SCALE_STIFFNESS, SCALE_DAMPING, dt);
          thumbScaleY = s.x;
          thumbScaleYVel = s.v;

          s = springStep(accentPos, accentVel, targetAccent, 200, 18, dt);
          accentPos = s.x;
          accentVel = s.v;

          s = springStep(trackScale, trackScaleVel, targetTrackScale, SCALE_STIFFNESS, SCALE_DAMPING, dt);
          trackScale = s.x;
          trackScaleVel = s.v;

          s = springStep(pointerX, 0, targetPointerX, 120, 14, dt);
          pointerX += (targetPointerX - pointerX) * Math.min(1, dt * 14);
          pointerY += (targetPointerY - pointerY) * Math.min(1, dt * 14);

          s = springStep(reflectionShift, reflectionVel, targetReflectionShift, 180, 16, dt);
          reflectionShift = s.x;
          reflectionVel = s.v;

          s = springStep(liquidPhase, liquidVel, targetLiquidPhase, 160, 14, dt);
          liquidPhase = s.x;
          liquidVel = s.v;

          highlightIntensity += (targetHighlight - highlightIntensity) * Math.min(1, dt * 12);
          trackBend += (targetBend - trackBend) * Math.min(1, dt * 16);

          ripple += rippleVel * dt;
          rippleVel *= 0.92;
          if (ripple < 0) {
            ripple = 0;
            rippleVel = 0;
          }

          if (checked) {
            ambientLiquid += dt * 0.35;
            if (ambientLiquid > 1) ambientLiquid -= 1;
          } else {
            ambientLiquid *= 0.92;
          }
        }

        const root = toggle.style;
        root.setProperty("--thumb-x", thumbPos.toFixed(4));
        root.setProperty("--accent-fill", accentPos.toFixed(4));
        root.setProperty("--track-scale", trackScale.toFixed(4));
        root.setProperty("--thumb-scale-x", thumbScaleX.toFixed(4));
        root.setProperty("--thumb-scale-y", thumbScaleY.toFixed(4));
        root.setProperty("--pointer-x", pointerX.toFixed(4));
        root.setProperty("--pointer-y", pointerY.toFixed(4));
        root.setProperty("--reflection-shift", reflectionShift.toFixed(2) + "px");
        root.setProperty("--parallax-x", parallaxX.toFixed(2) + "px");
        root.setProperty("--parallax-y", parallaxY.toFixed(2) + "px");
        const liquidDisplay = REDUCED_MOTION
          ? liquidPhase
          : liquidPhase * 0.72 + ambientLiquid * 0.28 * accentPos;
        root.setProperty("--liquid-phase", liquidDisplay.toFixed(4));
        root.setProperty("--ripple", ripple.toFixed(4));
        root.setProperty("--highlight-intensity", highlightIntensity.toFixed(4));
        root.setProperty("--track-bend", trackBend.toFixed(4));
        root.setProperty("--glow", checked ? "1" : "0");

        toggle.style.transform = `scale(${trackScale}) translateZ(0)`;

        rafId = requestAnimationFrame(tick);
      }

      function onPointerEnter(e) {
        isHover = true;
        toggle.dataset.hover = "true";
        updatePointerFromEvent(e);
        applyInteractionTargets();
      }

      function onPointerMove(e) {
        if (!isHover && !isPressed) return;
        updatePointerFromEvent(e);
      }

      function onPointerLeave() {
        isHover = false;
        delete toggle.dataset.hover;
        targetPointerX = 0.5;
        targetPointerY = 0.5;
        targetReflectionShift = 0;
        parallaxX = 0;
        parallaxY = 0;
        applyInteractionTargets();
      }

      function onPointerDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        isPressed = true;
        toggle.dataset.pressed = "true";
        updatePointerFromEvent(e);
        applyInteractionTargets();
      }

      function onPointerUp() {
        isPressed = false;
        delete toggle.dataset.pressed;
        applyInteractionTargets();
      }

      function onClick() {
        setChecked(!checked);
        applyInteractionTargets();
      }

      function onKeyDown(e) {
        if (e.key === " ") {
          e.preventDefault();
          isPressed = true;
          toggle.dataset.pressed = "true";
          applyInteractionTargets();
        }
      }

      function onKeyUp(e) {
        if (e.key === " ") {
          e.preventDefault();
          isPressed = false;
          delete toggle.dataset.pressed;
          applyInteractionTargets();
        }
      }

      toggle.addEventListener("pointerenter", onPointerEnter);
      toggle.addEventListener("pointermove", onPointerMove);
      toggle.addEventListener("pointerleave", onPointerLeave);
      toggle.addEventListener("pointerdown", onPointerDown);
      toggle.addEventListener("pointerup", onPointerUp);
      toggle.addEventListener("pointercancel", onPointerUp);
      toggle.addEventListener("click", onClick);
      toggle.addEventListener("keydown", onKeyDown);
      toggle.addEventListener("keyup", onKeyUp);

      window.addEventListener("blur", onPointerUp);

      applyInteractionTargets();
      rafId = requestAnimationFrame(tick);

      window.addEventListener("beforeunload", () => {
        if (rafId) cancelAnimationFrame(rafId);
      });
    })();
  </script>
</body>
</html>
